<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convoy of Bulls</title>
  <meta name="description" content="Convoy of Bulls — indie game studio.">
  <link rel="icon" type="image/png" href="logo.png">
  <meta property="og:title" content="Convoy of Bulls">
  <meta property="og:description" content="Indie game studio">
  <meta property="og:image" content="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #8a0000;
      --red-dark: #5c0000;
      --gold: #f0a030;
      --cream: #f4f0e6;
      --ink: #0e0e0e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: var(--red);
      background-image: radial-gradient(ellipse at center, var(--red) 0%, var(--red-dark) 100%);
      background-attachment: fixed;
      color: var(--cream);
      font-family: "VT323", monospace;
      font-size: 22px;
      line-height: 1.3;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 32px;
      min-height: 100vh;
    }
    main { width: 100%; max-width: 560px; text-align: center; flex: 1; }
    .logo {
      width: 240px; max-width: 70vw; height: auto;
      image-rendering: pixelated;
      border: 4px solid var(--ink);
      box-shadow: 8px 8px 0 var(--ink);
    }
    h1 {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(20px, 6vw, 32px);
      margin-top: 36px;
      text-shadow: 4px 4px 0 var(--ink);
      letter-spacing: 1px;
    }
    .tagline {
      color: var(--gold);
      font-size: 26px;
      margin-top: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    h2 {
      font-family: "Press Start 2P", monospace;
      font-size: 14px;
      color: var(--gold);
      margin: 48px 0 16px;
      text-shadow: 2px 2px 0 var(--ink);
    }
    .game {
      display: block;
      background: var(--ink);
      color: var(--cream);
      text-decoration: none;
      border: 4px solid var(--ink);
      box-shadow: 6px 6px 0 rgba(0,0,0,.45);
      transition: transform .1s, box-shadow .1s;
    }
    .game img { display: block; width: 100%; height: auto; }
    .game span {
      display: block;
      padding: 12px 14px;
      font-size: 26px;
    }
    .game span small { display: block; color: var(--gold); font-size: 20px; }
    .game:hover, .game:focus-visible { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 rgba(0,0,0,.45); }
    .socials {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .socials a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--cream);
      color: var(--ink);
      text-decoration: none;
      font-size: 24px;
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      transition: transform .1s, box-shadow .1s, background .1s;
    }
    .socials a:hover, .socials a:focus-visible {
      background: var(--gold);
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--ink);
    }
    .socials svg { width: 22px; height: 22px; fill: currentColor; }
    footer { margin-top: 56px; font-size: 18px; opacity: .7; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Convoy of Bulls logo" width="240" height="240">
    <h1>Convoy of Bulls</h1>
    <p class="tagline">Indie Game Studio</p>

    <h2>Games</h2>
    <a class="game" href="https://store.steampowered.com/app/5356450/That_Mountain_Needs_to_Fall/" target="_blank" rel="noopener">

      <span>That Mountain Needs to Fall<small>Wishlist on Steam &rarr;</small></span>
    </a>
